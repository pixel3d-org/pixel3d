[package]
name = "p3d-mcp"
description = "MCP server for agents."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
base64 = { workspace = true }
glam = { workspace = true }
p3d-control = { workspace = true }
p3d-engine = { workspace = true }
p3d-mesh = { workspace = true }
p3d-ops = { workspace = true }
p3d-perceive = { workspace = true }
p3d-query = { workspace = true }
p3d-render = { workspace = true }
p3d-scene = { workspace = true }
p3d-spec = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rmcp = { workspace = true, features = ["transport-io"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "io-std"] }
tracing = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
p3d-testdata = { workspace = true }
rmcp = { workspace = true, features = ["client", "transport-io"] }
tokio = { workspace = true, features = ["rt", "sync", "io-std", "io-util", "macros"] }
