[package]
name = "p3d-io"
description = "File formats: .p3d, glTF, FBX, OBJ and USD."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
base64 = { workspace = true }
blake3 = { workspace = true, features = ["pure"] }
glam = { workspace = true }
gltf = { workspace = true }
p3d-geo = { workspace = true }
p3d-math = { workspace = true }
p3d-mesh = { workspace = true }
p3d-scene = { workspace = true }
rkyv = { workspace = true, features = ["little_endian", "pointer_width_32"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
ufbx = { workspace = true }
zip = { workspace = true, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
serde_json = { workspace = true }
zip = { workspace = true, features = ["deflate-flate2-zlib-rs"] }
criterion = { workspace = true }
p3d-testdata = { workspace = true }

[[bench]]
name = "p3d"
harness = false

[[bench]]
name = "scale"
harness = false
