name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: ci (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      # Installs the toolchain pinned in rust-toolchain.toml and caches builds.
      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      # Render tests need a GPU adapter: lavapipe (software Vulkan) on Linux.
      # Windows has WARP built in; macOS runners have Metal.
      - name: Install lavapipe
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers

      # fmt, clippy, test, layers, emdash, deny, release build.
      - name: cargo xtask ci
        run: cargo xtask ci

      # Image tests that fail leave their pictures next to the baselines:
      # keep them to see the difference or to add a per-platform baseline.
      - name: Upload failing images
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failing-images-${{ matrix.os }}
          path: |
            **/tests/snapshots/**/*.new.png
            **/tests/snapshots/**/*.diff.png
            **/tests/golden/*.new.png
          if-no-files-found: ignore
