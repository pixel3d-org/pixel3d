[package]
name = "pixel3d-cli"
description = "pixel3d headless command-line interface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[dependencies]
anyhow = { workspace = true }
p3d-engine = { workspace = true }
p3d-io = { workspace = true }
p3d-mcp = { workspace = true }
p3d-ops = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt"] }

[dev-dependencies]
insta = { workspace = true, features = ["json"] }
