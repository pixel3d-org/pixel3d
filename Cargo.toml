[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
# Internal crates (layering: docs/architecture.md, checked by `cargo xtask layers`).
p3d-math = { path = "crates/math" }
p3d-mesh = { path = "crates/mesh" }
p3d-scene = { path = "crates/scene" }
p3d-query = { path = "crates/query" }
p3d-geo = { path = "crates/geo" }
p3d-uv = { path = "crates/uv" }
p3d-opt = { path = "crates/opt" }
p3d-bake = { path = "crates/bake" }
p3d-tex = { path = "crates/tex" }
p3d-rig = { path = "crates/rig" }
p3d-anim = { path = "crates/anim" }
p3d-render = { path = "crates/render" }
p3d-sdf = { path = "crates/sdf" }
p3d-remesh = { path = "crates/remesh" }
p3d-features = { path = "crates/features" }
p3d-strands = { path = "crates/strands" }
p3d-io = { path = "crates/io" }
p3d-profiles = { path = "crates/profiles" }
p3d-analyze = { path = "crates/analyze" }
p3d-perceive = { path = "crates/perceive" }
p3d-ops = { path = "crates/ops" }
p3d-graph = { path = "crates/graph" }
p3d-spec = { path = "crates/spec" }
p3d-engine = { path = "crates/engine" }
p3d-mcp = { path = "crates/mcp" }
p3d-control = { path = "crates/control" }
p3d-ui = { path = "crates/ui" }
p3d-plugin = { path = "crates/plugin" }
p3d-ai = { path = "crates/ai" }
p3d-testdata = { path = "crates/testdata" }

# Third-party crates. Versions verified on crates.io on 2026-10-12; take newer
# patch releases freely, verify compatibility before any minor or major bump.
# Crates are added to a member's [dependencies] when a phase first uses them.

# GUI (L5 only). winit and accesskit come from eframe. craft-ui (git, pinned
# rev) is added with the GUI shell.
egui = "0.36.2"
eframe = { version = "0.36.2", default-features = false }
egui-wgpu = "0.36.2"
egui-winit = "0.36.2"
epaint = "0.36.2"
egui_kittest = "0.36.2"
wgpu = "30.0.1"
rfd = "0.17.2"
arboard = { version = "3.6.1", default-features = false }
muda = "0.21.2"
transform-gizmo-egui = "0.11.0"
egui-snarl = "0.12.0"

# Math, geometry, algorithms
glam = { version = "0.34.1", features = ["serde", "bytemuck"] }
faer = "0.24.4"
obvhs = "0.4.0"
robust = "1.2.0"
spade = "2.15.1"
parry3d = "0.31.1"
manifold-rust = "0.16.0"
boolmesh = "0.2.1"
meshopt = "0.6.2"
rayon = "1.12.0"
smallvec = "1.16.3"
indexmap = "2.14.2"
rustc-hash = "2.1.3"
bytemuck = "1.25.2"
fixedbitset = "0.5.7"

# Images and textures
image = { version = "0.25.10", default-features = false }
png = "0.18.1"
exr = "1.74.2"
intel_tex_2 = "0.5.0"
ktx2 = "0.5.0"

# File formats
gltf = "1.4.1"
gltf-json = "1.4.1"
ufbx = "0.11.5"
fbxcel = "0.9.0"
openusd = "0.8.0"
tobj = "4.0.5"
miniz_oxide = "0.9.1"
zip = { version = "9.0.2", default-features = false }
blake3 = "1.8.7"

# Data, persistence, infrastructure
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_path_to_error = "0.1.20"
slotmap = "1.1.1"
rkyv = "0.8.18"
postcard = "1.1.3"
redb = "4.3.0"
thiserror = "2.0.21"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tracing-tracy = "0.12.0"
directories = "6.0.0"
notify = "8.2.0"
crossbeam-channel = "0.5.17"

# Agent interface, plugins, assistant (L5 only)
rmcp = "3.5.1"
schemars = "1.2.2"
tokio = { version = "1.53.2", default-features = false }
base64 = "0.23.1"
axum = "0.8.9"
wasmtime = "49.0.2"
wit-bindgen = "0.62.0"
rquickjs = "0.14.0"
oxc_parser = "0.153.0"
oxc_transformer = "0.153.0"
oxc_codegen = "0.153.0"
boa_engine = "0.22.0"
reqwest = { version = "0.13.5", default-features = false }
keyring = "4.2.0"

# Testing
insta = "1.49.0"
proptest = "1.12.0"
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
image-compare = "0.5.0"

[workspace.lints.rust]
unsafe_code = "forbid"

# Library rules. Apps and xtask define their own `[lints]` tables.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# Required: transactions roll back with catch_unwind.
panic = "unwind"
debug = "line-tables-only"

[profile.dev]
opt-level = 1

# Usable debug builds with fast dependencies.
[profile.dev.package."*"]
opt-level = 3
