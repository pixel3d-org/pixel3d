# cargo-deny configuration: licenses, advisories, banned crates, sources.
# Run with `cargo deny check` (part of `cargo xtask ci`).

[graph]
# Check every feature combination that can ship.
all-features = true

[advisories]
yanked = "deny"
ignore = []

[licenses]
# Permissive licenses only. MPL-2.0 is accepted only for dependencies used
# unmodified as separate libraries; record each one in NOTICE.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unlicense",
    "CC0-1.0",
    "MPL-2.0",
    # Boost Software License (permissive): the Windows clipboard backend of
    # arboard (clipboard-win, error-code), required by eframe. ADR 0004.
    "BSL-1.0",
]
confidence-threshold = 0.93
unused-allowed-license = "allow"
# Font licenses for egui's bundled font data only (Ubuntu-Light, Noto Emoji).
# ADR 0004; listed in NOTICE and ATTRIBUTION.md.
exceptions = [
    { crate = "epaint_default_fonts", allow = ["OFL-1.1", "Ubuntu-font-1.0"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace path dependencies are unversioned; every workspace crate is unpublished.
allow-wildcard-paths = true
highlight = "all"
deny = [
    { crate = "bincode", reason = "unmaintained and tombstoned (RUSTSEC-2025-0141)" },
    { crate = "embree", reason = "stale; use the in-house BVH stack (obvhs)" },
    { crate = "embree-rs", reason = "stale; use the in-house BVH stack (obvhs)" },
    { crate = "embree4-rs", reason = "stale; use the in-house BVH stack (obvhs)" },
    { crate = "embree4-sys", reason = "stale; use the in-house BVH stack (obvhs)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Git sources must be listed here with a pinned rev in Cargo.toml.
allow-git = [
    # craft-ui (MIT OR Apache-2.0), the shared egui components of the GUI shell.
    "https://github.com/storytold/craft-libs",
]
